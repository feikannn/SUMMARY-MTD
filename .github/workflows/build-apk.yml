name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip project (jika ada file .zip di root repo)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Mengekstrak $ZIP"
            rm -rf /tmp/proj && mkdir /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            SRC=/tmp/proj
            if [ "$(ls -A /tmp/proj | wc -l)" = "1" ] && [ -d "$(ls -d /tmp/proj/* | head -n 1)" ]; then
              SRC=$(ls -d /tmp/proj/* | head -n 1)
            fi
            rm -rf "$SRC/.github"
            cp -a "$SRC"/. ./
            rm -f "$ZIP"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Add project files" || true
            git push
          else
            echo "Tidak ada file .zip di root repo, memakai file yang sudah ada."
          fi

      - name: Cari folder project Expo
        id: loc
        run: |
          PKG=$(grep -rl --include=package.json '"expo"' . --exclude-dir=node_modules --exclude-dir=.git | head -n 1 || true)
          if [ -z "$PKG" ]; then
            echo "Folder project Expo tidak ditemukan. Isi repo:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "Project ditemukan di: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.loc.outputs.dir }}
        run: yarn install --ignore-scripts

      - name: Generate native Android project
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: ${{ steps.loc.outputs.dir }}/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Summary-apk
          path: ${{ steps.loc.outputs.dir }}/android/app/build/outputs/apk/release/*.apk
